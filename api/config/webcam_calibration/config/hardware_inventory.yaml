missing_expected_devices:
  required_runtime_camera: false

topology_risks:
  - The three fixed C270 cameras share USB bus 001 but use separate root ports and MJPG profiles.
  - The three C270 cameras report the same serial; by-id cannot distinguish them.
  - Stable by-path mapping and physical role labels must both be rechecked after any rewiring.
  - Production perception still requires independent capture/decode workers.
