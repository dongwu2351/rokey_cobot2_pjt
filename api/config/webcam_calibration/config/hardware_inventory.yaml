inventory_date: 2026-08-07
method: read_only_sysfs_v4l2_realsense_ros_graph_and_prompt11_recheck
robot_motion_performed: false

camera_system:
  active_camera_count: 4
  fixed_rgb_count: 3
  wrist_depth_count: 1
  spare_depth_count: 1
  spare_depth_runtime_required: false
  primary_avoidance_sensors: [cam0, cam1, cam2]
  near_field_sensor: wrist_depth

operator_reference:
  front_definition: operator_standing_side
  right_definition: operator_right_while_facing_workspace
  rear_definition: opposite_operator
  left_definition: operator_left_while_facing_workspace

camera_layout:
  version: operator_layout_v2
  cam0_role: front_center_upper
  cam1_role: front_right_upper
  cam2_role: rear_left_upper
  exact_120_degree_spacing_required: false
  common_workspace_overlap_required: true
  two_camera_visibility_required_in_critical_regions: true
  physical_mount_validation_complete: true

usb_topology:
  version: fixed_rgb_direct_root_ports_wrist_usb3_v3
  fixed_rgb_connection: direct_pc_root_ports_1_5_1_1_1_8
  wrist_depth_connection: separate_pc_usb3_bus_002_port_2
  spare_depth_connection: disconnected
  benchmark_required: false
  observed_topology_matches_intended: true

runtime_profiles:
  avoidance:
    fixed_rgb_enabled: true
    wrist_depth_required: false
  near_field_grasp:
    fixed_rgb_enabled: true
    wrist_depth_required: true
  calibration:
    activate_only_procedure_required_cameras: true
  spare_camera:
    enabled: false

spare_depth:
  role: spare_unconnected
  required: false
  runtime_enabled: false
  calibration_required: false

robot:
  model: Doosan M0609
  namespace: dsr01
  serial: not_queried
  joint_state:
    topic: /dsr01/joint_states
    type: sensor_msgs/msg/JointState
    position_unit: rad
    observed_name_order: [joint_1, joint_2, joint_4, joint_5, joint_3, joint_6]
    qos: {reliability: reliable, durability: transient_local}
  servoj:
    topic: /dsr01/servoj_stream
    type: dsr_msgs2/msg/ServojStream
    position_unit: deg
    subscription_qos: {reliability: reliable, durability: volatile}
    legacy_verified_rate_hz: 50.0
    current_hardware_publish_test_performed: true
    selected_hardware_rate_hz: 50.0

gripper:
  model: OnRobot RG2
  description_asset_found: false
  tcp_transform_status: physically_verified_by_operator_measurement
  legacy_candidate_tcp_z_m: 0.23813
  candidate_promoted_to_runtime_config: true

