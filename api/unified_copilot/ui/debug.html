<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Diagnostics</title><style>body{margin:0;background:#071018;color:#cceff4;font:13px ui-monospace;padding:24px}h1{font-weight:400;color:#66f6ff}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{border:1px solid #214a59;background:#0a1a24;padding:16px}img{width:100%;background:#000}pre{white-space:pre-wrap;color:#8fbbc5}.ok{color:#67ffc8}a{color:#66f6ff}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><h1>JARVIS / SYSTEM DIAGNOSTICS</h1><p><a href="/">← 사용자 인터페이스</a></p><div class="grid"><div class="card"><h2>WRIST RGB-D</h2><img id="cam"></div><div class="card"><h2>RUNTIME STATE</h2><pre id="state">loading…</pre></div></div><script>setInterval(()=>cam.src='/api/frame.jpg?t='+Date.now(),300);async function p(){try{state.textContent=JSON.stringify(await fetch('/api/state').then(r=>r.json()),null,2)}catch(e){state.textContent=e}setTimeout(p,500)}p()</script></body></html>
